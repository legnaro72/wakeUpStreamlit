name: Render Heartbeat Scheduled

on:
  schedule:
    - cron: "7,19,31,43,55 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WAKE_TARGETS: render
      RENDER_URLS: https://therapy-reminder.onrender.com/
      HTTP_TIMEOUT_SECONDS: "90"
      RENDER_ATTEMPTS: "2"
      RENDER_RETRY_DELAY_SECONDS: "15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-wake.txt

      - name: Ping Render app
        run: python -u wake_streamlit.py
