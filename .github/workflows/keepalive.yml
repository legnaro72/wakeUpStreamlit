name: Keep Scheduled Workflows Active

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keepalive.yml"
  schedule:
    # Repository activity prevents GitHub from disabling public scheduled workflows after 60 days.
    - cron: "37 4 1 * *"
    - cron: "37 4 20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record repository activity
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          git push
