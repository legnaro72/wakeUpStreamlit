name: Wake Streamlit Apps Scheduled

on:
  schedule:
    - cron: "0 5,6,9,10,13,14,17,18,21,22 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WAKE_TARGETS: streamlit
      STREAMLIT_RUN_HOURS: "7,11,15,19,23"
      FORCE_STREAMLIT: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-wake.txt "playwright>=1.44,<2"
          python -m playwright install chromium

      - name: Wake Streamlit apps
        run: python -u wake_streamlit.py
